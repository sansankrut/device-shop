<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PERIPRO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-image: url('https://www.wlmouse.com/cdn/shop/files/huan-mouse-banner.jpg?v=1764643913&width=1984');
            background-position: center;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 107, 53, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: -200px;
            right: -200px;
            animation: pulse 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 149, 0, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            animation: pulse 6s ease-in-out infinite reverse;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .signup-container {
            background: rgba(26, 26, 26, 0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #999;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s;
            line-height: 1;
        }

        .close-btn:hover {
            color: #fff;
        }

        .signup-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .signup-header h1 {
            color: #fff;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .signup-header p {
            color: #999;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: capitalize;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group input {
            width: 100%;
            padding: 14px 45px 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: #ff9500;
            box-shadow: 0 0 0 3px rgba(255, 149, 0, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .validation-icon {
            position: absolute;
            right: 16px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00ff00;
            display: none;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 12px;
            font-weight: bold;
        }

        .form-group input:valid ~ .validation-icon {
            display: flex;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff9500 0%, #ff6b35 100%);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 149, 0, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .signin-link {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 14px;
        }

        .signin-link a {
            color: #ff9500;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .signin-link a:hover {
            color: #ffaa33;
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 30px 25px;
            }

            .signup-header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <button class="close-btn">×</button>

        <div class="signup-header">
            <h1>Sign Up</h1>
            <p>Create your account to get started</p>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label for="nickname">Nickname</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="nickname" 
                        name="nickname" 
                        placeholder="Enter Your Nickname"
                        required
                        minlength="3"
                    >
                    <span class="validation-icon">✓</span>
                </div>
            </div>

            <div class="form-group">
                <label for="firstname">First Name</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="firstname" 
                        name="firstname" 
                        placeholder="Enter Your First Name"
                        required
                        minlength="2"
                    >
                    <span class="validation-icon">✓</span>
                </div>
            </div>

            <div class="form-group">
                <label for="lastname">Last Name</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="lastname" 
                        name="lastname" 
                        placeholder="Enter Your Last Name"
                        required
                        minlength="2"
                    >
                    <span class="validation-icon">✓</span>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter Your Email"
                        required
                    >
                    <span class="validation-icon">✓</span>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="******"
                        required
                        minlength="6"
                    >
                    <span class="validation-icon">✓</span>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Password confirmation</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="******"
                        required
                        minlength="6"
                    >
                    <span class="validation-icon">✓</span>
                </div>
            </div>

            <button type="submit" class="submit-btn">Create Account</button>

            <div class="signin-link">
                Already have an account? <a href="sign-in.html">Sign In Here</a>
            </div>
        </form>
    </div>

  <script>
    document.querySelector('.close-btn').addEventListener('click', () => {
        window.history.back();
    });

    document.getElementById('signupForm').addEventListener('submit', (e) => {
        e.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            alert('Passwords do not match!');
            return;
        }

        alert('Account created successfully!');

        // ⬇ Redirect to Sign In
        window.location.href = "sign-in.html";
    });

    document.querySelector(".signin-link a").addEventListener("click", (e) => {
        e.preventDefault();
        window.location.href = "sign-in.html";
    });

    document.getElementById('confirmPassword').addEventListener('input', (e) => {
        const password = document.getElementById('password').value;
        const confirmPassword = e.target.value;

        e.target.style.borderColor =
            confirmPassword && password !== confirmPassword ? '#ff4444' :
            confirmPassword && password === confirmPassword ? '#00ff00' : '';
    });
</script>

</body>
</html>
